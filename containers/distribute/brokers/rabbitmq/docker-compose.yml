# TODO: Use Secrets to store the passwords to all containers.
# TODO: Implement Traefik labels for reverse proxy, even in local network.
# TODO: Create self signed certificates the same way as all the containers using them.
networks:
  internal:
    name: "internal"
    # External means the container will be accessible from other containers in the same local network.
    # If you want to isolate the container create a new network, with different name for each container and without being external.
    external: true

volumes:
  rabbitmq:
    name: "rabbitmq"

services:
  rabbitmq:
    image: "rabbitmq:3.13-management-alpine"
    container_name: "rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    networks:
      - "internal"
    ports:
      - "${RABBITMQ_PORT?Variable not set}:${RABBITMQ_PORT?Variable not set}"
      - "${RABBITMQ_MANAGEMENT_PORT?Variable not set}:${RABBITMQ_MANAGEMENT_PORT?Variable not set}"
    volumes:
      - "rabbitmq:/var/lib/rabbitmq"
      - "./configuration/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf.template:ro"
      - "./configuration/render-config.sh:/usr/local/bin/render-config.sh:ro"
      - "./certificates:/etc/rabbitmq/certificates:ro"
    environment:
      - "RABBITMQ_DEFAULT_USER=${RABBITMQ_USER?Variable not set}"
      - "RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD?Variable not set}"
      - "RABBITMQ_CONSUMER_TIMEOUT=${RABBITMQ_CONSUMER_TIMEOUT?Variable not set}"
      - "RABBITMQ_PORT=${RABBITMQ_PORT?Variable not set}"
      - "RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT?Variable not set}"
      - "RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE?Variable not set}"
    command: ["sh", "/usr/local/bin/render-config.sh"]
    labels:
      - "traefik.enable=false"
