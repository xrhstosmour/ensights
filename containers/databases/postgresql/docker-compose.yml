# TODO: Use Secrets to store the passwords to all containers.
# TODO: Add extra performance configuration, using https://pgtune.leopard.in.ua/#/.
networks:
  internal:
    name: "ensights-internal"

volumes:
  postgresql:
    name: "ensights-postgresql"

services:
  postgresql:
    image: "postgres:16-alpine"
    container_name: "ensights-postgresql"
    healthcheck:
      # The port is interpolated by Compose, the same way `command` below does
      # it, because the server is told to listen on POSTGRESQL_PORT while
      # `pg_isready` would otherwise probe its own default of 5432. On any
      # other port the container never reports healthy, and every
      # `depends_on: service_healthy` waiting on it stalls until it times out.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p ${POSTGRESQL_PORT?Variable not set}"]
      interval: "5s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
    networks:
      - "internal"
    ports:
      # Loopback-only: other containers reach this over the `internal` Docker
      # network directly, not through the published host port, so this is
      # for local/tunnelled admin access only, the same restriction already
      # applied to pgAdmin4/Metabase/Redis Commander/Mailpit.
      - "127.0.0.1:${POSTGRESQL_PORT?Variable not set}:${POSTGRESQL_PORT?Variable not set}"
    volumes:
      - "postgresql:/var/lib/postgresql/data"
      - "./configuration/postgresql.conf:/etc/postgresql.conf:ro"
      - "./initialize-databases.sh:/docker-entrypoint-initdb.d/initialize-databases.sh:ro"
    environment:
      - "POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD?Variable not set}"
      - "POSTGRES_USER=${POSTGRESQL_USER?Variable not set}"
      - "POSTGRES_HOST_AUTH_METHOD=${POSTGRESQL_AUTHENTICATION_METHOD?Variable not set}"
      - "POSTGRESQL_ADDITIONAL_DATABASES=${POSTGRESQL_ADDITIONAL_DATABASES:-}"
    command: "-c config_file=/etc/postgresql.conf -p ${POSTGRESQL_PORT?Variable not set}"
    labels:
      - "traefik.enable=false"
