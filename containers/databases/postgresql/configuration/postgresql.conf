# Generate a tailored configuration file for your hardware at https://pgtune.leopard.in.ua/#/.
# DB Version: 16
# OS Type: linux
# DB Type: web
# Total Memory (RAM): 2 GB
# CPUs num: 2
# Connections num: 20
# Data Storage: ssd
max_connections = 20
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 256MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 26214kB
huge_pages = off
min_wal_size = 1GB
max_wal_size = 4GB

# Set 1 hour timeout for idle connections in milliseconds.
idle_session_timeout = 3600000ms

# Without this, Postgres only binds to localhost inside its own container and
# refuses connections from every other container on the shared `internal`
# network (GlitchTip, Metabase, pgAdmin4, and anything else in a separate
# compose project). This does not add any new exposure beyond what's already
# declared in `docker-compose.yml`'s `ports:` mapping, which is now
# loopback-only, see that file's comment for why.
listen_addresses = '*'
