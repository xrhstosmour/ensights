networks:
  internal:
    name: "ensights-internal"

volumes:
  metabase:
    name: "ensights-metabase"

services:
  metabase:
    image: "metabase/metabase:v0.62.17"
    container_name: "ensights-metabase"
    # Metabase migrates its own application database on first boot, which takes
    # a couple of minutes, so a container that is up is not yet a Metabase that
    # serves. Without this, anything downstream can only see the container
    # state, and a boot that crash-loops on the application database looks
    # exactly like one that is still starting.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -I http://localhost:3000/api/health || exit 1"]
      interval: "15s"
      timeout: "5s"
      retries: 10
      start_period: "180s"
    restart: "unless-stopped"
    entrypoint:
      - "sh"
      - "-c"
      - >-
        until nc -z -w 2 postgresql ${METABASE_DATABASE_PORT?Variable not set}; do
          echo "Waiting for postgresql...";
          sleep 2;
        done;
        exec /app/run_metabase.sh
    networks:
      - "internal"
    ports:
      - "127.0.0.1:${METABASE_PORT?Variable not set}:3000"
    volumes:
      - "metabase:/metabase-data"
    environment:
      - "MB_DB_TYPE=${METABASE_DATABASE_TYPE?Variable not set}"
      - "MB_DB_DBNAME=${METABASE_DATABASE_NAME?Variable not set}"
      - "MB_DB_PORT=${METABASE_DATABASE_PORT?Variable not set}"
      - "MB_DB_USER=${METABASE_DATABASE_USER?Variable not set}"
      - "MB_DB_PASS=${METABASE_DATABASE_PASSWORD?Variable not set}"
      - "MB_DB_HOST=postgresql"
    labels:
      - "traefik.enable=false"
