name: Thesis CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ["thesis/**", ".github/workflows/thesis.yml"]

  pull_request:
    branches: [main]
    paths: ["thesis/**", ".github/workflows/thesis.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same image, pinned to the same digest, the Makefile uses with
    # ENGINE=docker, so a local build and this job resolve identical TeX
    # Live, bibtex and font versions. Pinned rather than `:latest`: that tag
    # drifts, and an upstream TeX Live update once broke the Greek
    # bibliography strings this manuscript depends on.
    container: texlive/texlive@sha256:1cb66a6dc31fe153369c5bb63549aea31c2ffb351613af67b182d84c8521fe89
    defaults:
      run:
        working-directory: thesis
    steps:
      - uses: actions/checkout@v4

      # The department's `dimscthesis` class sets Arial and Courier New, which
      # no TeX distribution ships. Debian carries them in contrib, under
      # Microsoft's own redistribution licence, so the job installs them
      # rather than substituting a metric clone that would change the glyphs
      # of the PDF that gets committed back.
      - name: Install the class fonts
        working-directory: .
        run: |
          sed -i "s/^Components: main$/Components: main contrib/" /etc/apt/sources.list.d/*.sources
          apt-get update -qq
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | debconf-set-selections
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ttf-mscorefonts-installer fontconfig
          fc-cache -f

      - name: Compile thesis
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      # A missing citation or cross-reference still exits zero, so the log is
      # checked explicitly to keep the manuscript honest as chapters land.
      - name: Fail on undefined references or citations
        run: |
          if grep -qE "LaTeX Warning: (Citation|Reference) .* undefined" main.log; then
            echo "Undefined references or citations found:"
            grep -E "LaTeX Warning: (Citation|Reference) .* undefined" main.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/main.pdf
          if-no-files-found: error

      # The exported PDF is committed so the manuscript can be read from the
      # repository directly. Refreshing it here keeps it from drifting behind
      # thesis/ when someone edits a chapter and forgets to re-export. Only on
      # main, and only when the bytes actually changed. The commit touches
      # documents/ alone, which this workflow does not watch, so it cannot
      # retrigger itself.
      - name: Commit the exported PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          # The document class takes the author in parts, so the slug is
          # assembled from the Latin surname and first name, the same way
          # scripts/export-thesis.sh does it. An empty slug is a hard failure:
          # falling back to a placeholder name writes the PDF to a path git
          # does not track, and the step then reports nothing to commit while
          # the committed PDF silently goes stale.
          author_last=$(sed -n 's/^\\authorLastEn{\(.*\)}.*/\1/p' thesis/metadata.tex)
          author_first=$(sed -n 's/^\\authorFirstEn{\(.*\)}.*/\1/p' thesis/metadata.tex)
          if [ -z "$author_last" ] || [ -z "$author_first" ]; then
            echo "Could not read the author name from thesis/metadata.tex."
            exit 1
          fi
          author_slug=$(echo "${author_last}-${author_first}" | tr ' ' '-')
          destination="documents/${author_slug}-thesis.pdf"
          if [ ! -f "$destination" ]; then
            echo "$destination is not the committed export, refusing to guess."
            exit 1
          fi
          cp thesis/main.pdf "$destination"

          # This must come first. The container runs as a different user than
          # the checkout owner, so until the directory is trusted every other
          # git command fails with "not in a git directory".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$destination"; then
            echo "Exported PDF already current, nothing to commit."
            exit 0
          fi

          git add "$destination"
          git commit -m "Refresh the exported thesis PDF"
          git push
