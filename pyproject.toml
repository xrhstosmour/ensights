[project]
name = "ensights"
version = "0.1.0"
description = "Generic e-commerce business intelligence platform: data mining and machine learning driven marketing/sales insights (frequent itemsets, clustering, forecasting, unit economics)."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Christos Mouratidis", email = "xrhstosmour@gmail.com"}
]

dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.22",
    "greenlet>=3.1.1",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT[crypto]>=2.10.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "alembic>=1.14.0",
    "tenacity>=9.0.0",
    "structlog>=25.0.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "celery-redbeat>=2.3.0",
    "email-validator>=2.2.0",
    "phonenumbers>=8.13.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "webauthn>=2.8.0",
    "boto3>=1.35.0",
    "Pillow>=10.0.0",
    "pybreaker>=0.8.0",
    # Analysis stack. These are runtime dependencies, not notebook extras:
    # the mining and clustering tasks run inside Celery workers.
    "pandas>=2.2.0",
    "mlxtend>=0.23.0",
    "statsmodels>=0.14.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "amqp>=5.3.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "celery[redis]>=5.4.0",
]

# Notebook and modelling stack. Kept out of the runtime dependencies so the
# API image stays small; install with `uv sync --extra analysis`.
analysis = [
    "matplotlib>=3.9.0",
    "jupyterlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["venv", ".venv", "alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "celery.*",
    "sentry_sdk.*",
    "pyotp.*",
    "qrcode.*",
    "PIL.*",
    "webauthn.*",
    "boto3.*",
    "botocore.*",
    "pybreaker.*",
    "phonenumbers.*",
    "mlxtend.*",
    "pandas.*",
    "sklearn.*",
    "statsmodels.*",
]
ignore_missing_imports = true

[tool.ruff]
# Pinned below the project's actual py314 minimum: ruff's formatter has an
# open bug where target-version "py314" rewrites `except (A, B):` into the
# unparenthesized PEP 758 form, which several ruff releases then emit
# inconsistently. Revert to "py314" once astral-sh/ruff#23090 is fixed.
target-version = "py313"
exclude = ["venv", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T201", # print statements
    "ANN", # annotations
]
ignore = [
    "E501",  # line too long
    "B904",  # raise from - let HTTPExceptions pass through
    "ANN001",  # missing type for self in bound tasks
    "ANN002", # missing type for *args
    "ANN003", # missing type for **kwargs
    "ANN201", # missing return type on public functions
    "ANN202", # missing return type on private functions
    "ANN204", # missing return type for __call__
    "ANN401", # Any types in function signatures
]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -n auto"
markers = [
    "slow: requires running services; deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
